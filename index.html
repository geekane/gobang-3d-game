<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五子棋 · 人机对战</title>
  <meta name="description" content="15×15 五子棋人机对战 — 启发式 AI，禅意极简设计" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grain" aria-hidden="true"></div>

  <header class="header">
    <div class="logo" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="32" height="32" rx="8" fill="#1E2228" stroke="rgba(255,255,255,0.12)"/>
        <path d="M8 12.5h18M8 17.5h18M8 22.5h18M12.5 8v18M17.5 8v18M22.5 8v18" stroke="#5B6068" stroke-width="1"/>
        <circle cx="17.5" cy="17.5" r="4.2" fill="#0C0D10" stroke="#C9AE7E" stroke-width="1.2"/>
        <circle cx="22.5" cy="12.5" r="2.6" fill="#EDE9E1" stroke="rgba(0,0,0,0.25)" stroke-width="0.8"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>五子棋 · 人机对战</h1>
      <p>GOBANG &nbsp;/&nbsp; 15 × 15</p>
    </div>
    <div class="header-meta">
      <span class="live-dot" aria-hidden="true"></span>
      <span>本地 AI 引擎</span>
    </div>
  </header>

  <main class="layout">
    <section class="board-card">
      <div class="board-head">
        <div id="status" class="status">
          <svg class="status-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5.2" fill="#101216" stroke="#C9AE7E" stroke-width="1.4"/>
          </svg>
          <span id="statusText">轮到你落子（黑棋）</span>
        </div>
        <div id="moveCount" class="move-count">手数 0</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="board" width="640" height="640"></canvas>
        <div id="winOverlay" class="win-overlay hidden">
          <div class="win-card">
            <div id="winIcon" class="win-icon" aria-hidden="true"></div>
            <h2 id="winTitle">你赢了</h2>
            <p id="winDesc">漂亮的五连。</p>
            <button id="againBtn" class="btn primary">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 1.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              再来一局
            </button>
          </div>
        </div>
      </div>
      <div class="hint">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 7.2v3.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8" cy="5" r="0.9" fill="currentColor"/>
        </svg>
        <span>悬停预览落子 · 黑棋先行 · 连成五子获胜</span>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <h3>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2L3.4 12.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          对局设置
        </h3>

        <label class="label">执子选择</label>
        <div class="seg" id="colorSeg">
          <button data-color="black" class="active">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#0E0F12" stroke="rgba(255,255,255,0.35)" stroke-width="1"/></svg>
            执黑先行
          </button>
          <button data-color="white">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#EDE9E1" stroke="rgba(0,0,0,0.3)" stroke-width="1"/></svg>
            执白后行
          </button>
        </div>

        <label class="label">AI 难度</label>
        <div class="seg" id="levelSeg">
          <button data-level="easy">新手</button>
          <button data-level="medium" class="active">进阶</button>
          <button data-level="hard">大师</button>
        </div>

        <label class="label row-between">AI 思考 <span id="thinkingLabel" class="thinking"></span></label>

        <div class="btn-grid">
          <button id="restartBtn" class="btn primary">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 1.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            重新开始
          </button>
          <button id="undoBtn" class="btn">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M6.5 3.5L3 7l3.5 3.5M3 7h6.5a3.5 3.5 0 0 1 0 7H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-1)"/>
            </svg>
            悔棋
          </button>
        </div>
        <div class="btn-grid">
          <button id="swapBtn" class="btn ghost">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2.5 5.5h9M9.5 3l2.5 2.5-2.5 2.5M13.5 10.5h-9M6.5 8l-2.5 2.5L6.5 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            交换先后手
          </button>
          <button id="hintBtn" class="btn ghost">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 1.8a4.2 4.2 0 0 0-2.4 7.6c.6.5 1 1.1 1.1 1.8h2.6c.1-.7.5-1.3 1.1-1.8A4.2 4.2 0 0 0 8 1.8zM6.6 13h2.8M7.2 14.2h1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            AI 支招
          </button>
        </div>
      </div>

      <div class="card">
        <h3>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2.5 13.5v-4M6.5 13.5v-7M10.5 13.5V4.5M14 13.5V2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          棋局信息
        </h3>
        <div class="info-row"><span>你执</span><b id="youAre">黑棋</b></div>
        <div class="info-row"><span>当前回合</span><b id="turnInfo">黑棋</b></div>
        <div class="info-row"><span>AI 状态</span><b id="aiState">待机</b></div>
        <div class="progress"><div id="aiBar"></div></div>
        <div class="history-head">棋谱记录</div>
        <ol id="history" class="history"></ol>
      </div>

      <div class="card rules">
        <h3>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 2.5h8.5A1.5 1.5 0 0 1 13 4v9.5H4.5A1.5 1.5 0 0 1 3 12V2.5z" stroke="currentColor" stroke-width="1.4"/>
            <path d="M3 10.5h10M6 5.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          玩法说明
        </h3>
        <ul>
          <li>黑棋先行，双方轮流在交叉点落子。</li>
          <li>横 / 竖 / 斜任一方向先连成 5 子即获胜。</li>
          <li>悔棋会同时撤回你与 AI 的各一步。</li>
          <li>大师难度带 2 步预判，试试防守反击。</li>
        </ul>
      </div>
    </aside>
  </main>

  <footer>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.1"/>
      <circle cx="6" cy="6" r="1.8" fill="currentColor"/>
    </svg>
    <span>HTML · CSS · JavaScript — 启发式 AI 评估</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
